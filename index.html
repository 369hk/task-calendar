<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日任務動態日曆</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --rd-color: #f43f5e;
      --rd-bg: rgba(244, 63, 94, 0.15);
      --bass-color: #06b6d4;
      --jp-color: #a855f7;
      --abs-color: #10b981;
      --chest-color: #f59e0b;
      --leg-color: #ec4899;
      --back-color: #6366f1;
      --j-color: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 18px 24px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
    }

    .title-group h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .month-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: #334155;
      color: var(--text-main);
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #475569;
    }

    .btn-primary {
      background: #0284c7;
    }

    .btn-primary:hover {
      background: #0369a1;
    }

    .month-title {
      font-size: 1.25rem;
      font-weight: 700;
      min-width: 140px;
      text-align: center;
    }

    .dashboard-panel {
      background: var(--card-bg);
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .legend-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      color: #fff;
      user-select: none;
    }

    .badge-rd { background: var(--rd-color); }
    .badge-bass { background: var(--bass-color); }
    .badge-jp { background: var(--jp-color); }
    .badge-abs { background: var(--abs-color); }
    .badge-chest { background: var(--chest-color); }
    .badge-leg { background: var(--leg-color); }
    .badge-back { background: var(--back-color); }
    .badge-j { background: var(--j-color); color: #000; font-weight: 700; }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .calendar-header-day {
      text-align: center;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 8px 0;
      color: var(--text-muted);
    }

    .calendar-cell {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      min-height: 125px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s, transform 0.1s;
    }

    .calendar-cell:hover {
      border-color: #64748b;
    }

    .calendar-cell.other-month {
      opacity: 0.35;
    }

    .calendar-cell.today {
      border: 2.5px solid var(--accent);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }

    .calendar-cell.is-rd {
      background: linear-gradient(180deg, var(--card-bg) 0%, var(--rd-bg) 100%);
      border-color: rgba(244, 63, 94, 0.5);
    }

    .cell-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .cell-date {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .cell-rd-tag {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--rd-color);
      color: white;
      text-transform: uppercase;
    }

    .task-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-grow: 1;
    }

    .task-pill {
      font-size: 0.72rem;
      padding: 3px 6px;
      border-radius: 5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 16px;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    @media (max-width: 768px) {
      .calendar-cell {
        min-height: 95px;
        padding: 5px;
      }
      .task-pill {
        font-size: 0.65rem;
        padding: 2px 4px;
      }
      .month-title {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="title-group">
      <h1>🗓 每日任務動態排程日曆</h1>
    </div>
    <div class="month-controls">
      <button class="btn" id="prevMonthBtn">◀ 上個月</button>
      <div class="month-title" id="monthDisplay"></div>
      <button class="btn" id="nextMonthBtn">下個月 ▶</button>
      <button class="btn btn-primary" id="todayBtn">今天</button>
    </div>
  </header>

  <div class="dashboard-panel">
    <div class="legend-list">
      <span class="badge badge-rd">🏖️ RD (放假)</span>
      <span class="badge badge-bass">🎸 Bass</span>
      <span class="badge badge-jp">🇯🇵 日文</span>
      <span class="badge badge-abs">⚡ 腹</span>
      <span class="badge badge-leg">🦵 腳</span>
      <span class="badge badge-chest">🛡️ 胸</span>
      <span class="badge badge-back">🧗 背</span>
      <span class="badge badge-j">⭐ 任務 J</span>
    </div>

    <!-- 更改為清空當月 RD -->
    <button class="btn" id="clearRdBtn" title="清空當前檢視月份的所有 RD">清空當月 RD</button>
  </div>

  <div class="calendar-grid" id="calendarGrid"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalDateTitle">任務清單</div>
      <button class="btn" id="modalCloseBtn">✕</button>
    </div>
    <div class="modal-body" id="modalTaskContent"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="modalToggleRdBtn">切換 RD 狀態</button>
    </div>
  </div>
</div>

<script>
  // ================= 本地時間安全轉換輔助函式 =================
  function formatLocalDate(d) {
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  // ================= 核心設定 =================
  const STORAGE_KEY_RD = 'calendar_rd_dates_v1';

  // 永久鎖定基準起算日為 2026-10-01
  const baseDateStr = '2026-10-01';
  let rdSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY_RD) || '[]'));

  let viewDate = new Date();

  const calendarGrid = document.getElementById('calendarGrid');
  const monthDisplay = document.getElementById('monthDisplay');
  const prevMonthBtn = document.getElementById('prevMonthBtn');
  const nextMonthBtn = document.getElementById('nextMonthBtn');
  const todayBtn = document.getElementById('todayBtn');
  const clearRdBtn = document.getElementById('clearRdBtn');

  const modalOverlay = document.getElementById('modalOverlay');
  const modalDateTitle = document.getElementById('modalDateTitle');
  const modalTaskContent = document.getElementById('modalTaskContent');
  const modalToggleRdBtn = document.getElementById('modalToggleRdBtn');
  const modalCloseBtn = document.getElementById('modalCloseBtn');
  let selectedDateStr = null;

  // ================= 任務核心動態推導引擎 =================
  function generateScheduleMap(upToDateStr) {
    const schedule = {};
    const [sY, sM, sD] = baseDateStr.split('-').map(Number);
    const start = new Date(sY, sM - 1, sD);

    const [eY, eM, eD] = upToDateStr.split('-').map(Number);
    const end = new Date(eY, eM - 1, eD);

    let curr = new Date(start);
    const finalEnd = new Date(Math.max(start.getTime(), end.getTime()));
    finalEnd.setDate(finalEnd.getDate() + 45);

    let lastNonRdPart1 = 'Bass';
    let isFirstNonRd = true;
    let daysSinceLastJ = 5;

    while (curr <= finalEnd) {
      const dStr = formatLocalDate(curr);
      const isRD = rdSet.has(dStr);
      const diffDays = Math.round((curr - start) / (1000 * 60 * 60 * 24));

      // 1. Part 1: Bass / 日文
      let part1Tasks = [];
      if (isRD) {
        part1Tasks = ['Bass', '日文'];
      } else {
        if (isFirstNonRd) {
          part1Tasks = ['Bass'];
          lastNonRdPart1 = 'Bass';
          isFirstNonRd = false;
        } else {
          const nextTask = (lastNonRdPart1 === 'Bass') ? '日文' : 'Bass';
          part1Tasks = [nextTask];
          lastNonRdPart1 = nextTask;
        }
      }

      // 2. Part 2: 腹(0) -> 腳(1) -> 胸(2) -> 背(3)
      let workoutTasks = [];
      if (diffDays >= 0) {
        if (diffDays % 2 === 0) workoutTasks.push('腹');
        if ((diffDays - 1) >= 0 && (diffDays - 1) % 4 === 0) workoutTasks.push('腳');
        if ((diffDays - 2) >= 0 && (diffDays - 2) % 3 === 0) workoutTasks.push('胸');
        if ((diffDays - 3) >= 0 && (diffDays - 3) % 4 === 0) workoutTasks.push('背');
      }

      // 3. Part 3: 任務 J
      let hasTaskJ = false;
      if (isRD && daysSinceLastJ >= 5) {
        hasTaskJ = true;
        daysSinceLastJ = 0;
      } else {
        daysSinceLastJ++;
      }

      schedule[dStr] = {
        isRD,
        part1Tasks,
        workoutTasks,
        hasTaskJ
      };

      curr.setDate(curr.getDate() + 1);
    }

    return schedule;
  }

  // ================= 渲染日曆 =================
  function renderCalendar() {
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();

    monthDisplay.textContent = `${year} 年 ${month + 1} 月`;

    const firstDayOfMonth = new Date(year, month, 1);
    const lastDayOfMonth = new Date(year, month + 1, 0);

    const startDate = new Date(firstDayOfMonth);
    startDate.setDate(startDate.getDate() - startDate.getDay());

    const endDate = new Date(lastDayOfMonth);
    endDate.setDate(endDate.getDate() + (6 - endDate.getDay()));

    const schedule = generateScheduleMap(formatLocalDate(endDate));

    calendarGrid.innerHTML = '';
    const weekDays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    weekDays.forEach(day => {
      const dayHeader = document.createElement('div');
      dayHeader.className = 'calendar-header-day';
      dayHeader.textContent = day;
      calendarGrid.appendChild(dayHeader);
    });

    const todayStr = formatLocalDate(new Date());
    let iterDate = new Date(startDate);

    while (iterDate <= endDate) {
      const dStr = formatLocalDate(iterDate);
      const isCurrentMonth = iterDate.getMonth() === month;
      const isToday = (dStr === todayStr);
      const dayData = schedule[dStr] || { isRD: rdSet.has(dStr), part1Tasks: [], workoutTasks: [], hasTaskJ: false };

      const cell = document.createElement('div');
      cell.className = `calendar-cell ${!isCurrentMonth ? 'other-month' : ''} ${isToday ? 'today' : ''} ${dayData.isRD ? 'is-rd' : ''}`;
      cell.dataset.date = dStr;

      const cellTop = document.createElement('div');
      cellTop.className = 'cell-top';

      const dateNum = document.createElement('span');
      dateNum.className = 'cell-date';
      dateNum.textContent = iterDate.getDate();
      cellTop.appendChild(dateNum);

      if (dayData.isRD) {
        const rdBadge = document.createElement('span');
        rdBadge.className = 'cell-rd-tag';
        rdBadge.textContent = 'RD';
        cellTop.appendChild(rdBadge);
      }

      cell.appendChild(cellTop);

      const taskContainer = document.createElement('div');
      taskContainer.className = 'task-container';

      dayData.part1Tasks.forEach(t => {
        const pill = document.createElement('div');
        pill.className = `task-pill badge-${t === 'Bass' ? 'bass' : 'jp'}`;
        pill.innerHTML = `<span>${t === 'Bass' ? '🎸' : '🇯🇵'} ${t}</span>`;
        taskContainer.appendChild(pill);
      });

      if (dayData.workoutTasks.length > 0) {
        dayData.workoutTasks.forEach(w => {
          const pill = document.createElement('div');
          let cls = 'badge-abs';
          let icon = '⚡';
          if (w === '胸') { cls = 'badge-chest'; icon = '🛡️'; }
          if (w === '腳') { cls = 'badge-leg'; icon = '🦵'; }
          if (w === '背') { cls = 'badge-back'; icon = '🧗'; }
          pill.className = `task-pill ${cls}`;
          pill.innerHTML = `<span>${icon} ${w}</span>`;
          taskContainer.appendChild(pill);
        });
      }

      if (dayData.hasTaskJ) {
        const pill = document.createElement('div');
        pill.className = 'task-pill badge-j';
        pill.innerHTML = `<span>⭐ 任務 J</span>`;
        taskContainer.appendChild(pill);
      }

      cell.appendChild(taskContainer);

      cell.addEventListener('click', () => {
        openModal(dStr, dayData);
      });

      calendarGrid.appendChild(cell);
      iterDate.setDate(iterDate.getDate() + 1);
    }
  }

  function openModal(dateStr, data) {
    selectedDateStr = dateStr;
    modalDateTitle.textContent = `${dateStr} 任務清單`;
    modalToggleRdBtn.textContent = data.isRD ? '取消 RD (設為工作日)' : '設為 RD (放假日)';

    let html = `
      <div style="margin-bottom: 8px;">
        <strong>當日狀態：</strong> ${data.isRD ? '<span style="color:var(--rd-color);font-weight:bold;">🏖️ RD 放假</span>' : '💼 工作日'}
      </div>
      <div><strong>任務排程：</strong></div>
      <ul style="padding-left: 20px; line-height: 1.8;">
    `;

    if (data.part1Tasks.length > 0) {
      html += `<li><strong>Part 1 (樂器與語言)：</strong> ${data.part1Tasks.join(' + ')}</li>`;
    }
    if (data.workoutTasks.length > 0) {
      html += `<li><strong>Part 2 (健身部位)：</strong> ${data.workoutTasks.join('、')}</li>`;
    } else {
      html += `<li><strong>Part 2 (健身部位)：</strong> 今日休息</li>`;
    }
    if (data.hasTaskJ) {
      html += `<li style="color:var(--j-color);font-weight:bold;">⭐ <strong>Part 3：</strong> 執行任務 J</li>`;
    }

    html += `</ul>`;
    modalTaskContent.innerHTML = html;
    modalOverlay.style.display = 'flex';
  }

  function closeModal() {
    modalOverlay.style.display = 'none';
    selectedDateStr = null;
  }

  modalToggleRdBtn.addEventListener('click', () => {
    if (!selectedDateStr) return;
    if (rdSet.has(selectedDateStr)) {
      rdSet.delete(selectedDateStr);
    } else {
      rdSet.add(selectedDateStr);
    }
    localStorage.setItem(STORAGE_KEY_RD, JSON.stringify([...rdSet]));
    closeModal();
    renderCalendar();
  });

  modalCloseBtn.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
  });

  prevMonthBtn.addEventListener('click', () => {
    viewDate.setMonth(viewDate.getMonth() - 1);
    renderCalendar();
  });

  nextMonthBtn.addEventListener('click', () => {
    viewDate.setMonth(viewDate.getMonth() + 1);
    renderCalendar();
  });

  todayBtn.addEventListener('click', () => {
    viewDate = new Date();
    renderCalendar();
  });

  // 清空當月 RD 的核心邏輯
  clearRdBtn.addEventListener('click', () => {
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth() + 1;
    const monthPrefix = `${year}-${String(month).padStart(2, '0')}`;

    if (confirm(`確定要清空 ${year} 年 ${month} 月的所有 RD 嗎？`)) {
      for (const d of Array.from(rdSet)) {
        if (d.startsWith(monthPrefix)) {
          rdSet.delete(d);
        }
      }
      localStorage.setItem(STORAGE_KEY_RD, JSON.stringify([...rdSet]));
      renderCalendar();
    }
  });

  renderCalendar();
</script>
</body>
</html>
